name: Daily technicals

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 4:10 pm IST, after NSE close
    - cron: "15 2 * * 1-5"    # 7:45 am IST, fresh global/index data before the pre-market brief
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy requests
      - run: python scripts/technicals.py
      - name: Commit data
        run: |
          git config user.name "finpulse-bot"
          git config user.email "finpulse-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: technicals $(date -u +%F_%H%M)"
          git push
